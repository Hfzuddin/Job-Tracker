# =============================================================
# JobTrack — Production Override
# =============================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# Access:
#   App: http://localhost (port 80)
# =============================================================

services:
  # ----- PHP Application (FPM — no exposed ports) -----
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: jobtrack-app-prod
    restart: always
    ports: []   # Override: no direct port exposure
    volumes:
      - app_storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-jobtrack}
      - DB_USERNAME=${DB_USERNAME:-jobtrack}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    networks:
      - jobtrack

  # ----- Nginx Reverse Proxy -----
  nginx:
    image: nginx:alpine
    container_name: jobtrack-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - jobtrack

  # ----- MySQL (no exposed port in production) -----
  mysql:
    ports: []   # Override: no external access

volumes:
  app_storage:
    driver: local
