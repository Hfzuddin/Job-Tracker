# =============================================================
# JobTrack — Development Environment
# =============================================================
# Usage:
#   docker compose up              → Start dev environment
#   docker compose up --build      → Rebuild and start
#   docker compose down            → Stop all services
#   docker compose down -v         → Stop and remove volumes
#
# Access:
#   App:   http://localhost:8000
#   Vite:  http://localhost:5173 (HMR)
#   MySQL: localhost:3306
# =============================================================

services:
  # ----- PHP Application (Dev Server + Vite) -----
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: jobtrack-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"     # Laravel dev server
      - "${VITE_PORT:-5173}:5173"    # Vite HMR
    volumes:
      - .:/var/www/html                          # Live code sync
      - vendor_data:/var/www/html/vendor         # Persist PHP deps
      - node_modules_data:/var/www/html/node_modules  # Persist JS deps
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-jobtrack}
      - DB_USERNAME=${DB_USERNAME:-jobtrack}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_SEED=${DB_SEED:-false}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jobtrack

  # ----- MySQL Database -----
  mysql:
    image: mysql:8.0
    container_name: jobtrack-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-jobtrack}
      MYSQL_USER: ${DB_USERNAME:-jobtrack}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - jobtrack

volumes:
  mysql_data:
    driver: local
  vendor_data:
    driver: local
  node_modules_data:
    driver: local

networks:
  jobtrack:
    driver: bridge
